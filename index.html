<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibiza Roadtrip · Logboek</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="icon.jpg">
<meta name="theme-color" content="#1B2A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ibiza">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --ink:#1B2A3A;
    --ink-soft:#33475A;
    --whitewash:#F7F5EF;
    --whitewash-dim:#EDE9DE;
    --sun:#E8A33D;
    --sun-soft:#F4CB8B;
    --pine:#3E5C4A;
    --clay:#C1502E;
    --mauve:#7A5C6E;
    --line:#DED8C8;
    --radius:14px;
    --shadow:0 8px 24px -12px rgba(27,42,58,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--whitewash);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    letter-spacing:-0.01em;
  }
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:0.01em; }

  /* ---------- Layout shell ---------- */
  .app{
    display:grid;
    grid-template-columns: 380px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header header"
      "sidebar map";
    height:100vh;
  }
  @media (max-width: 880px){
    .app{
      display:flex;
      flex-direction:column;
      height:auto;
      min-height:100vh;
    }
    header{ order:1; }
    .map-wrap{ order:2; height:48vh; min-height:320px; flex-shrink:0; }
    #sidebar{ order:3; }
  }

  /* ---------- Header ---------- */
  header{
    grid-area:header;
    background:var(--ink);
    color:var(--whitewash);
    padding:18px 24px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--sun);
  }
  header .brand{ display:flex; align-items:baseline; gap:12px; }
  header h1{ margin:0; font-size:22px; font-weight:600; }
  header .tag{ font-size:12px; color:var(--sun-soft); text-transform:uppercase; letter-spacing:.14em; }
  header .trip-config{ display:flex; gap:10px; align-items:center; font-size:13px; flex-wrap:wrap; }
  header .trip-config label{ display:flex; flex-direction:column; gap:3px; color:#C9D3DC; font-size:11px; text-transform:uppercase; letter-spacing:.08em;}
  header input{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:var(--whitewash);
    padding:6px 8px;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  header input::-webkit-calendar-picker-indicator{ filter:invert(1); }

  /* ---------- Sidebar ---------- */
  #sidebar{
    grid-area:sidebar;
    background:var(--whitewash);
    border-right:1px solid var(--line);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  .section{
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .section h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.1em;
    font-family:'Inter',sans-serif;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 12px;
  }

  /* calendar */
  .cal-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .cal-day{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:8px 4px 6px; text-align:center; cursor:pointer;
  }
  .cal-day .wd{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
  .cal-day .dt{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-top:1px; color:var(--ink); }
  .cal-day .count{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); margin-top:2px; }
  .cal-day.active{ background:var(--ink); border-color:var(--ink); }
  .cal-day.active .wd, .cal-day.active .dt, .cal-day.active .count{ color:var(--whitewash); }
  .cal-extra{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }

  /* category tabs (per-category "blad") */
  .cat-tabs{ display:flex; gap:2px; margin:-4px -4px 10px; border-bottom:1px solid var(--line); }
  .cat-tab{
    flex:1; text-align:center; padding:8px 4px 9px; font-size:12px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent;
    white-space:nowrap; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .cat-tab .dot{ width:8px; height:8px; border-radius:50%; }
  .cat-tab.active{ color:var(--ink); border-bottom-color:currentColor; }

  /* filters */
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    padding:5px 11px;
    border-radius:999px;
    font-size:12.5px;
    cursor:pointer;
    border:1.5px solid var(--line);
    background:#fff;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--ink-soft);
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; }
  .chip.active{ border-color:currentColor; background:var(--whitewash-dim); font-weight:600; color:var(--ink); }

  /* place list */
  #placeList{ padding:8px 12px 20px; overflow-y:auto; flex:1; }
  .place-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .place-card:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
  .place-card.empty-state{
    cursor:default; text-align:center; color:var(--ink-soft);
    font-size:13px; padding:24px 14px;
  }
  .place-card .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .place-card .cat-badge{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    padding:2px 8px; border-radius:999px; color:#fff; font-weight:600;
    white-space:nowrap;
  }
  .place-card h3{ margin:6px 0 2px; font-size:16px; font-weight:600; }
  .place-card .notes{ font-size:13px; color:var(--ink-soft); margin:4px 0 8px; line-height:1.4; }
  .place-card .meta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .place-card select{
    font-size:12px; border:1px solid var(--line); border-radius:6px; padding:3px 6px;
    background:#fff; color:var(--ink); font-family:'Inter',sans-serif;
  }
  .place-card .order-badge{
    font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--ink);
    color:var(--sun-soft); width:20px;height:20px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .place-card .fav-btn, .place-card .del-btn{
    border:none; background:none; cursor:pointer; font-size:15px; padding:2px 4px; color:var(--ink-soft);
  }
  .place-card .fav-btn.active{ color:var(--sun); }
  .place-card .move-btns{ display:flex; gap:2px; }
  .place-card .move-btns button{
    border:1px solid var(--line); background:#fff; border-radius:5px; width:22px; height:22px;
    cursor:pointer; font-size:11px; color:var(--ink-soft);
  }

  /* add place */
  .add-form{ display:flex; flex-direction:column; gap:8px; }
  .add-form input, .add-form select, .add-form textarea{
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-family:'Inter',sans-serif;
    font-size:13.5px; width:100%; background:#fff;
  }
  .add-form textarea{ resize:vertical; min-height:44px; }
  .btn{
    padding:9px 14px; border-radius:8px; border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
  }
  .btn-primary{ background:var(--clay); color:#fff; }
  .btn-primary:hover{ background:#a8431f; }
  .btn-ghost{ background:var(--whitewash-dim); color:var(--ink); }
  .btn-ghost:hover{ background:var(--line); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:6px 10px; font-size:12.5px; }

  .search-row{ display:flex; gap:6px; }
  .search-row input{ flex:1; }
  #geocodeResults{ display:flex; flex-direction:column; gap:4px; margin-top:6px; max-height:160px; overflow-y:auto; }
  .geo-result{
    text-align:left; background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:7px 9px; font-size:12.5px; cursor:pointer; color:var(--ink-soft);
  }
  .geo-result:hover{ background:var(--whitewash-dim); }

  .footer-actions{ padding:14px 20px; display:flex; gap:8px; }

  /* ---------- Map ---------- */
  .map-wrap{ grid-area:map; position:relative; height:100%; width:100%; min-height:280px; }
  #map{ height:100%; width:100%; min-height:280px; z-index:0; background:#DED8C8; }
  .map-error{
    position:absolute; inset:0; z-index:2000; display:none;
    align-items:center; justify-content:center; text-align:center;
    background:var(--whitewash); color:var(--ink-soft); padding:24px; font-size:14px;
  }
  .map-error.show{ display:flex; flex-direction:column; gap:10px; }
  .map-error button{ align-self:center; }
  .map-pick-banner{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    z-index:1000; background:var(--ink); color:var(--whitewash);
    padding:10px 10px 10px 16px; border-radius:999px; box-shadow:var(--shadow);
    display:none; align-items:center; gap:12px; font-size:13.5px;
    border:2px solid var(--sun); max-width:90%;
  }
  .map-pick-banner.show{ display:flex; }
  .map-pick-banner .btn{ background:var(--sun); color:var(--ink); white-space:nowrap; }
  .leaflet-popup-content{ font-family:'Inter',sans-serif; font-size:13px; }
  .leaflet-popup-content h4{ font-family:'Fraunces',serif; margin:0 0 4px; font-size:15px; }

  /* ---------- Toast / confirm (alert()/confirm() are silently no-ops in
     standalone "Add to Home Screen" mode on iOS, so we use our own UI) --- */
  #toastStack{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    z-index:5000; display:flex; flex-direction:column; gap:8px; align-items:center;
    width:min(92vw, 420px);
  }
  .toast{
    background:var(--ink); color:var(--whitewash); border:2px solid var(--sun);
    border-radius:999px; padding:10px 18px; font-size:13.5px; box-shadow:var(--shadow);
    text-align:center;
  }
  .toast.error{ border-color:var(--clay); }
  .confirm-overlay{
    position:fixed; inset:0; z-index:6000; background:rgba(27,42,58,.55);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .confirm-overlay.show{ display:flex; }
  .confirm-box{
    background:var(--whitewash); border-radius:var(--radius); padding:20px;
    max-width:340px; width:100%; box-shadow:var(--shadow); text-align:center;
  }
  .confirm-box p{ margin:0 0 16px; font-size:14.5px; color:var(--ink); }
  .confirm-box .row{ display:flex; gap:10px; justify-content:center; }

  .numbered-icon{
    background:var(--ink); color:var(--sun-soft); font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:12px; width:26px; height:26px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg); display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4); border:2px solid var(--whitewash);
  }
  .numbered-icon span{ transform:rotate(45deg); }
  .cat-icon{
    width:16px; height:16px; border-radius:50%; border:2.5px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="brand">
      <h1>Ibiza Roadtrip</h1>
      <span class="tag">Logboek voor onderweg · 5–12 september</span>
    </div>
  </header>

  <div id="sidebar">

    <div class="section">
      <h2>Kalender</h2>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-extra" id="calExtra"></div>
    </div>

    <div class="section">
      <h2>Plek toevoegen</h2>
      <div class="add-form">
        <div class="search-row">
          <input type="text" id="geoSearch" placeholder="Zoek adres of plaatsnaam op Ibiza…">
          <button class="btn btn-ghost btn-sm" id="geoSearchBtn">Zoek</button>
        </div>
        <div id="geocodeResults"></div>
        <button class="btn btn-ghost btn-sm" id="pickOnMapBtn" type="button">Of kies locatie op de kaart</button>

        <input type="text" id="placeName" placeholder="Naam van de plek">
        <select id="placeCategory"></select>
        <textarea id="placeNotes" placeholder="Notities (bv. reserveren nodig, parkeertip, beste tijdstip…)"></textarea>
        <button class="btn btn-primary btn-block" id="addPlaceBtn">Plek opslaan</button>
      </div>
    </div>

    <div class="section" style="border-bottom:none; flex:1; display:flex; flex-direction:column; padding-bottom:0;">
      <div class="cat-tabs" id="catTabs"></div>
      <h2 id="listTitle">Alle plekken</h2>
      <div id="placeList"></div>
    </div>

    <div class="footer-actions" style="flex-wrap:wrap; align-items:center;">
      <button class="btn btn-ghost btn-sm" id="refreshBtn" title="Nieuwste plekken ophalen">↻ Ververs</button>
      <button class="btn btn-ghost btn-sm" id="exportBtn">Exporteer JSON</button>
      <button class="btn btn-ghost btn-sm" id="importBtn">Importeer JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
      <button class="btn btn-ghost btn-sm" id="locateBtn" title="Centreer op mijn locatie">📍 Mijn locatie</button>
      <span id="syncStatus" class="mono" style="font-size:11px; color:var(--ink-soft); margin-left:auto;"></span>
    </div>

  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-pick-banner" id="mapPickBanner">
      <span>📍 Tik op de kaart om deze plek te plaatsen</span>
      <button class="btn btn-sm" id="cancelPickBtn" type="button">Annuleer</button>
    </div>
    <div class="map-error" id="mapError">
      <span>⚠️ De kaart kon niet geladen worden.</span>
      <button class="btn btn-sm" id="mapRetryBtn" type="button">Opnieuw proberen</button>
    </div>
  </div>

</div>

<div id="toastStack"></div>
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="row">
      <button class="btn btn-ghost btn-sm" id="confirmCancelBtn" type="button">Annuleer</button>
      <button class="btn btn-primary btn-sm" id="confirmOkBtn" type="button">Ja, verwijderen</button>
    </div>
  </div>
</div>

<script>
/* ============ Toast / confirm helpers ============
   iOS Safari silently drops alert()/confirm() when the site runs as a
   "standalone" home-screen web app (no browser chrome to host the native
   dialog) — so errors used to look like "nothing happens". These replace
   them with in-page UI that always works. */
function showToast(message, isError){
  const stack = document.getElementById('toastStack');
  if(!stack){ console.log(message); return; }
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = message;
  stack.appendChild(t);
  setTimeout(() => t.remove(), isError ? 6000 : 3500);
}
function confirmDialog(message){
  return new Promise((resolve) => {
    const overlay = document.getElementById('confirmOverlay');
    document.getElementById('confirmMessage').textContent = message;
    overlay.classList.add('show');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    function cleanup(result){
      overlay.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

if(typeof L === 'undefined'){
  showToast('De kaartbibliotheek (Leaflet) kon niet geladen worden. Controleer je internetverbinding en herlaad de pagina.', true);
}
/* ============ Config ============ */
const CATEGORIES = {
  strand:      { label: 'Strand',   color: '#E8A33D' },
  eten:        { label: 'Eten',     color: '#C1502E' },
  shopping:    { label: 'Shopping', color: '#7A5C6E' },
  andere:      { label: 'Andere',   color: '#33475A' },
};
const IBIZA_CENTER = [38.9843, 1.4085];
// Reisdatums liggen vast op 5 t/m 12 september.
const TRIP_START = '2026-09-05';
const TRIP_DAYS = 8;

/* ============ Supabase ============ */
const SUPABASE_URL = 'https://npztyprvrnazuvspjbvn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_j0LX1z6zcn4Bf7zlPvCXlQ_-y2PmbC5';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function setSyncStatus(text, isError){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? 'var(--clay)' : 'var(--ink-soft)';
}

/* ============ State ============ */
// activeDay/activeCat are local-only (per device), places live in Supabase.
let state = defaultState();
function defaultState(){
  return {
    activeDay: 0,       // 0 = alle dagen, -1 = niet ingedeeld, 1..N = dag
    activeCat: Object.keys(CATEGORIES)[0],
    places: []
  };
}
function mapRow(row){
  return {
    id: row.id, name: row.name, category: row.category,
    notes: row.notes || '', lat: row.lat, lng: row.lng,
    day: row.day, order: row.order, favorite: row.favorite
  };
}
async function fetchAllFromSupabase(){
  setSyncStatus('Synchroniseren…');
  const { data: places, error: err1 } = await sb.from('ibiza_places').select('*').order('created_at', { ascending: true });
  if(err1){
    setSyncStatus('Sync mislukt — offline?', true);
    console.error(err1);
    return false;
  }
  state.places = (places || []).map(mapRow);
  setSyncStatus('Bijgewerkt ' + new Date().toLocaleTimeString('nl-BE', {hour:'2-digit', minute:'2-digit'}));
  return true;
}

/* ============ Map setup ============ */
function showMapError(show){
  const el = document.getElementById('mapError');
  if(el) el.classList.toggle('show', !!show);
}

const map = L.map('map', { zoomControl: true }).setView(IBIZA_CENTER, 11);

// Canonieke tile-URL zonder lettersubdomeinen (a/b/c.tile... wordt afgeraden
// door OSM en faalt soms op mobiel netwerk/Safari). Met een fallback-provider
// (CARTO) mocht de primaire tegelserver even niet bereikbaar zijn.
let usingFallbackTiles = false;
let tileLoadOk = false;
let tileErrorTimer = null;

function buildTileLayer(url, attribution){
  return L.tileLayer(url, { attribution, maxZoom: 19, crossOrigin: true });
}

let tileLayer = buildTileLayer(
  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  '&copy; OpenStreetMap-bijdragers'
).addTo(map);

function switchToFallbackTiles(){
  if(usingFallbackTiles) return;
  usingFallbackTiles = true;
  map.removeLayer(tileLayer);
  tileLayer = buildTileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
    '&copy; OpenStreetMap-bijdragers &copy; CARTO'
  ).addTo(map);
  tileLayer.on('load', () => { tileLoadOk = true; showMapError(false); });
  tileLayer.on('tileerror', () => { if(!tileLoadOk) showMapError(true); });
}

tileLayer.on('load', () => { tileLoadOk = true; showMapError(false); clearTimeout(tileErrorTimer); });
tileLayer.on('tileerror', () => { if(!tileLoadOk) switchToFallbackTiles(); });
// Als er na 6s nog geen enkele tegel is binnengekomen (bv. stille netwerkfout
// zonder 'tileerror' event op iOS), toon een duidelijke fout i.p.v. een lege kaart.
tileErrorTimer = setTimeout(() => { if(!tileLoadOk) showMapError(true); }, 6000);

document.getElementById('mapRetryBtn')?.addEventListener('click', () => {
  showMapError(false);
  tileLoadOk = false;
  tileLayer.redraw();
  clearTimeout(tileErrorTimer);
  tileErrorTimer = setTimeout(() => { if(!tileLoadOk) switchToFallbackTiles(); }, 6000);
});

let markersLayer = L.layerGroup().addTo(map);
let pickModeActive = false;

// iOS Safari verandert de viewport-hoogte wanneer de adresbalk in-/uitschuift,
// zonder altijd een 'resize' event te vuren op window. Daarom ook luisteren op
// visualViewport en een ResizeObserver op de kaart-container zelf.
function refreshMapSize(){ map.invalidateSize(); }
window.addEventListener('resize', refreshMapSize);
if(window.visualViewport) window.visualViewport.addEventListener('resize', refreshMapSize);
if(window.ResizeObserver){
  new ResizeObserver(refreshMapSize).observe(document.querySelector('.map-wrap'));
}
[100, 400, 1000].forEach(ms => setTimeout(refreshMapSize, ms));
document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshMapSize(); });

map.on('click', (e) => {
  if(!pickModeActive) return;
  pendingCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
  markersLayer.clearLayers();
  renderMarkers();
  L.marker([pendingCoords.lat, pendingCoords.lng]).addTo(markersLayer)
    .bindPopup('Nieuwe locatie — vul de naam in en sla op').openPopup();
  pickModeActive = false;
  document.getElementById('mapPickBanner').classList.remove('show');
});

function catIcon(catKey){
  const color = CATEGORIES[catKey]?.color || '#333';
  return L.divIcon({
    className: '',
    html: `<div class="cat-icon" style="background:${color}"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8]
  });
}
function numberedIcon(n, catKey){
  const color = CATEGORIES[catKey]?.color || '#1B2A3A';
  return L.divIcon({
    className: '',
    html: `<div class="numbered-icon" style="background:${color}"><span>${n}</span></div>`,
    iconSize: [26,26],
    iconAnchor: [13,24]
  });
}

/* ============ Geocoding (Nominatim) ============ */
let pendingCoords = null;

document.getElementById('geoSearchBtn').addEventListener('click', doGeocode);
document.getElementById('geoSearch').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); doGeocode(); }
});

async function doGeocode(){
  const q = document.getElementById('geoSearch').value.trim();
  const resultsEl = document.getElementById('geocodeResults');
  if(!q){ resultsEl.innerHTML = ''; return; }
  resultsEl.innerHTML = '<div class="geo-result">Zoeken…</div>';
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q + ' Ibiza')}`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'nl' } });
    const data = await res.json();
    if(!data.length){
      resultsEl.innerHTML = '<div class="geo-result">Niks gevonden — probeer een andere naam.</div>';
      return;
    }
    resultsEl.innerHTML = '';
    data.forEach(item => {
      const div = document.createElement('div');
      div.className = 'geo-result';
      div.textContent = item.display_name;
      div.addEventListener('click', () => {
        pendingCoords = { lat: parseFloat(item.lat), lng: parseFloat(item.lon) };
        document.getElementById('placeName').value = document.getElementById('placeName').value || item.display_name.split(',')[0];
        map.setView([pendingCoords.lat, pendingCoords.lng], 15);
        markersLayer.clearLayers();
        renderMarkers();
        L.marker([pendingCoords.lat, pendingCoords.lng]).addTo(markersLayer).bindPopup('Gekozen locatie').openPopup();
        resultsEl.innerHTML = '';
        document.getElementById('geoSearch').value = '';
      });
      resultsEl.appendChild(div);
    });
  }catch(e){
    resultsEl.innerHTML = '<div class="geo-result">Zoeken mislukt. Check je internetverbinding.</div>';
  }
}

document.getElementById('pickOnMapBtn').addEventListener('click', () => {
  pickModeActive = true;
  document.getElementById('mapPickBanner').classList.add('show');
  document.querySelector('.map-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => map.invalidateSize(), 350);
});
document.getElementById('cancelPickBtn').addEventListener('click', () => {
  pickModeActive = false;
  document.getElementById('mapPickBanner').classList.remove('show');
});

/* ============ Add place ============ */
const catSelect = document.getElementById('placeCategory');
Object.entries(CATEGORIES).forEach(([key, val]) => {
  const opt = document.createElement('option');
  opt.value = key; opt.textContent = val.label;
  catSelect.appendChild(opt);
});

document.getElementById('addPlaceBtn').addEventListener('click', async () => {
  const name = document.getElementById('placeName').value.trim();
  const notes = document.getElementById('placeNotes').value.trim();
  const category = catSelect.value;

  if(!name){ showToast('Geef de plek een naam.', true); return; }
  if(!pendingCoords){ showToast('Zoek een adres op of kies een locatie op de kaart.', true); return; }

  const btn = document.getElementById('addPlaceBtn');
  btn.disabled = true; btn.textContent = 'Opslaan…';

  const { data, error } = await sb.from('ibiza_places').insert({
    name, notes, category,
    lat: pendingCoords.lat, lng: pendingCoords.lng,
    day: -1, order: 0, favorite: false
  }).select().single();

  btn.disabled = false; btn.textContent = 'Plek opslaan';

  if(error){
    showToast('Opslaan mislukt: ' + error.message, true);
    return;
  }
  state.places.push(mapRow(data));
  pendingCoords = null;
  document.getElementById('placeName').value = '';
  document.getElementById('placeNotes').value = '';
  renderAll();
});

/* ============ Calendar ============ */
function dateForDay(d){
  const start = new Date(TRIP_START + 'T00:00:00');
  const dt = new Date(start);
  dt.setDate(start.getDate() + (d - 1));
  return dt;
}
function dayLabel(d){
  return dateForDay(d).toLocaleDateString('nl-BE', { weekday: 'short', day: 'numeric', month: 'short' });
}
function renderCalendar(){
  const grid = document.getElementById('calGrid');
  const extra = document.getElementById('calExtra');
  grid.innerHTML = '';
  for(let d = 1; d <= TRIP_DAYS; d++){
    const dt = dateForDay(d);
    const wd = dt.toLocaleDateString('nl-BE', { weekday: 'short' });
    const count = state.places.filter(p => p.day === d).length;
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (state.activeDay === d ? ' active' : '');
    cell.innerHTML = `<div class="wd">${wd}</div><div class="dt">${dt.getDate()}</div><div class="count">${count ? count : ''}</div>`;
    cell.addEventListener('click', () => {
      state.activeDay = state.activeDay === d ? 0 : d;
      renderAll();
    });
    grid.appendChild(cell);
  }
  extra.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (state.activeDay === 0 ? ' active' : '');
  allChip.textContent = 'Alle dagen';
  allChip.addEventListener('click', () => { state.activeDay = 0; renderAll(); });
  extra.appendChild(allChip);

  const unassignedCount = state.places.filter(p => p.day === -1).length;
  const unChip = document.createElement('div');
  unChip.className = 'chip' + (state.activeDay === -1 ? ' active' : '');
  unChip.textContent = `Nog niet gepland (${unassignedCount})`;
  unChip.addEventListener('click', () => { state.activeDay = state.activeDay === -1 ? 0 : -1; renderAll(); });
  extra.appendChild(unChip);
}

/* ============ Category tabs (elke categorie = eigen blad) ============ */
function renderCatTabs(){
  const el = document.getElementById('catTabs');
  el.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, val]) => {
    const count = state.places.filter(p => p.category === key).length;
    const active = state.activeCat === key;
    const tab = document.createElement('div');
    tab.className = 'cat-tab' + (active ? ' active' : '');
    if(active) tab.style.color = val.color;
    tab.innerHTML = `<span class="dot" style="background:${val.color}"></span>${val.label} (${count})`;
    tab.addEventListener('click', () => {
      state.activeCat = key;
      renderAll();
    });
    el.appendChild(tab);
  });
}

/* ============ Place list ============ */
function visiblePlaces(){
  let list = state.places.filter(p => p.category === state.activeCat);
  if(state.activeDay !== 0){
    list = list.filter(p => p.day === state.activeDay);
  }
  if(state.activeDay > 0){
    list.sort((a,b) => a.order - b.order);
  } else {
    list.sort((a,b) => (b.favorite - a.favorite) || a.name.localeCompare(b.name));
  }
  return list;
}

function renderPlaceList(){
  const el = document.getElementById('placeList');
  const titleEl = document.getElementById('listTitle');
  const list = visiblePlaces();

  if(state.activeDay === 0) titleEl.textContent = `${CATEGORIES[state.activeCat].label} (${list.length})`;
  else if(state.activeDay === -1) titleEl.textContent = `${CATEGORIES[state.activeCat].label} · Nog niet gepland (${list.length})`;
  else titleEl.textContent = `${CATEGORIES[state.activeCat].label} · ${dayLabel(state.activeDay)} (${list.length})`;

  el.innerHTML = '';
  if(!list.length){
    el.innerHTML = `<div class="place-card empty-state">Nog niks hier. Zoek hierboven een adres of kies een plek op de kaart.</div>`;
    return;
  }

  list.forEach((p, idx) => {
    const cat = CATEGORIES[p.category];
    const card = document.createElement('div');
    card.className = 'place-card';

    const dayOptions = [`<option value="-1" ${p.day===-1?'selected':''}>Niet ingedeeld</option>`];
    for(let d=1; d<=TRIP_DAYS; d++){
      dayOptions.push(`<option value="${d}" ${p.day===d?'selected':''}>${dayLabel(d)}</option>`);
    }
    const catOptions = Object.entries(CATEGORIES).map(([key, val]) =>
      `<option value="${key}" ${p.category===key?'selected':''}>${val.label}</option>`
    );

    card.innerHTML = `
      <div class="row1">
        <div style="display:flex; align-items:center; gap:8px;">
          ${state.activeDay > 0 ? `<span class="order-badge">${idx+1}</span>` : ''}
          <span class="cat-badge" style="background:${cat.color}">${cat.label}</span>
        </div>
        <div>
          <button class="fav-btn ${p.favorite?'active':''}" data-fav="${p.id}">★</button>
          <button class="del-btn" data-del="${p.id}">✕</button>
        </div>
      </div>
      <h3>${escapeHtml(p.name)}</h3>
      ${p.notes ? `<div class="notes">${escapeHtml(p.notes)}</div>` : ''}
      <div class="meta">
        <select data-catselect="${p.id}">${catOptions.join('')}</select>
        <select data-dayselect="${p.id}">${dayOptions.join('')}</select>
        ${state.activeDay > 0 ? `<div class="move-btns">
            <button data-up="${p.id}">↑</button>
            <button data-down="${p.id}">↓</button>
          </div>` : ''}
      </div>
    `;
    card.addEventListener('click', (e) => {
      if(e.target.closest('button') || e.target.closest('select')) return;
      map.setView([p.lat, p.lng], 16);
    });
    el.appendChild(card);
  });

  el.querySelectorAll('[data-fav]').forEach(btn => btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const p = state.places.find(x => x.id === btn.dataset.fav);
    p.favorite = !p.favorite;
    renderAll();
    const { error } = await sb.from('ibiza_places').update({ favorite: p.favorite }).eq('id', p.id);
    if(error){ setSyncStatus('Opslaan mislukt', true); console.error(error); }
  }));
  el.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const ok = await confirmDialog('Deze plek verwijderen?');
    if(!ok) return;
    const id = btn.dataset.del;
    state.places = state.places.filter(x => x.id !== id);
    renderAll();
    const { error } = await sb.from('ibiza_places').delete().eq('id', id);
    if(error){ setSyncStatus('Verwijderen mislukt', true); showToast('Verwijderen mislukt: ' + error.message, true); console.error(error); }
  }));
  el.querySelectorAll('[data-catselect]').forEach(sel => sel.addEventListener('change', async (e) => {
    e.stopPropagation();
    const p = state.places.find(x => x.id === sel.dataset.catselect);
    const prevCategory = p.category;
    p.category = sel.value;
    renderAll();
    const { error } = await sb.from('ibiza_places').update({ category: p.category }).eq('id', p.id);
    if(error){
      p.category = prevCategory;
      renderAll();
      showToast('Categorie wijzigen mislukt: ' + error.message, true);
      console.error(error);
    }
  }));
  el.querySelectorAll('[data-dayselect]').forEach(sel => sel.addEventListener('change', async (e) => {
    e.stopPropagation();
    const p = state.places.find(x => x.id === sel.dataset.dayselect);
    p.day = parseInt(sel.value, 10);
    const dayItems = state.places.filter(x => x.day === p.day);
    p.order = dayItems.length ? Math.max(...dayItems.map(x=>x.order)) + 1 : 0;
    renderAll();
    const { error } = await sb.from('ibiza_places').update({ day: p.day, order: p.order }).eq('id', p.id);
    if(error){ setSyncStatus('Opslaan mislukt', true); console.error(error); }
  }));
  el.querySelectorAll('[data-up]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation(); moveInDay(btn.dataset.up, -1);
  }));
  el.querySelectorAll('[data-down]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation(); moveInDay(btn.dataset.down, 1);
  }));
}

async function moveInDay(id, dir){
  const dayItems = state.places.filter(p => p.day === state.activeDay).sort((a,b)=>a.order-b.order);
  const idx = dayItems.findIndex(p => p.id === id);
  const swapIdx = idx + dir;
  if(swapIdx < 0 || swapIdx >= dayItems.length) return;
  const tmp = dayItems[idx].order;
  dayItems[idx].order = dayItems[swapIdx].order;
  dayItems[swapIdx].order = tmp;
  renderAll();
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    sb.from('ibiza_places').update({ order: dayItems[idx].order }).eq('id', dayItems[idx].id),
    sb.from('ibiza_places').update({ order: dayItems[swapIdx].order }).eq('id', dayItems[swapIdx].id)
  ]);
  if(e1 || e2){ setSyncStatus('Opslaan mislukt', true); console.error(e1 || e2); }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ============ Markers ============ */
function renderMarkers(){
  markersLayer.clearLayers();
  const list = visiblePlaces();
  list.forEach((p, idx) => {
    const icon = state.activeDay > 0 ? numberedIcon(idx+1, p.category) : catIcon(p.category);
    const marker = L.marker([p.lat, p.lng], { icon }).addTo(markersLayer);
    marker.bindPopup(`<h4>${escapeHtml(p.name)}</h4>${p.notes ? `<div>${escapeHtml(p.notes)}</div>` : ''}<div style="margin-top:4px;color:#888;font-size:11px;">${CATEGORIES[p.category].label}</div>`);
  });
  if(state.activeDay > 0 && list.length > 1){
    const line = L.polyline(list.map(p => [p.lat, p.lng]), { color: '#1B2A3A', weight: 2, dashArray: '6 6', opacity: .6 });
    line.addTo(markersLayer);
  }
}

/* ============ Export / import ============ */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ibiza-roadtrip.json';
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const parsed = JSON.parse(ev.target.result);
      setSyncStatus('Importeren…');
      if(Array.isArray(parsed.places) && parsed.places.length){
        const rows = parsed.places.map(p => ({
          name: p.name, category: p.category, notes: p.notes || '',
          lat: p.lat, lng: p.lng, day: p.day ?? -1, order: p.order ?? 0, favorite: !!p.favorite
        }));
        const { error } = await sb.from('ibiza_places').insert(rows);
        if(error){ showToast('Importeren mislukt: ' + error.message, true); return; }
      }
      await fetchAllFromSupabase();
      renderAll();
    }catch(err){ showToast('Kon dit bestand niet lezen.', true); }
  };
  reader.readAsText(file);
});
document.getElementById('refreshBtn').addEventListener('click', async () => {
  await fetchAllFromSupabase();
  renderAll();
});

/* ============ Geolocation ============ */
document.getElementById('locateBtn').addEventListener('click', () => {
  if(!navigator.geolocation){ showToast('Locatie niet beschikbaar in deze browser.', true); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 15),
    () => showToast('Kon je locatie niet ophalen.', true)
  );
});

/* ============ Render orchestration ============ */
function renderAll(){
  renderCalendar();
  renderCatTabs();
  renderPlaceList();
  renderMarkers();
}

async function init(){
  document.getElementById('listTitle').textContent = 'Laden…';
  const ok = await fetchAllFromSupabase();
  if(!ok){
    // Nog altijd renderen met lege staat zodat de app bruikbaar blijft als Supabase even niet bereikbaar is
  }
  renderAll();
  // Elke 20s stil op de achtergrond verversen, zodat je de plekken van je man ook ziet
  setInterval(async () => {
    await fetchAllFromSupabase();
    renderAll();
  }, 20000);
}
init();
</script>
